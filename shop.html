<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#073b32">
<title>فروشگاه | ZENVIA</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
--green:#073b32;
--green2:#105b49;
--gold:#c5a66b;
--bg:#f7faf7;
--white:#fff;
--text:#1d3027;
--muted:#78857d;
--border:#e7ede8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Vazirmatn,sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
button,input,select{font-family:inherit}
.container{width:min(1200px,92%);margin:auto}

header{
background:white;border-bottom:1px solid var(--border);
position:sticky;top:0;z-index:20
}
.nav{
height:75px;display:flex;justify-content:space-between;
align-items:center;gap:15px
}
.logo{font-size:23px;font-weight:800;color:var(--green);letter-spacing:2px}
.logo small{display:block;font-size:10px;letter-spacing:0;color:var(--muted)}
.nav-links{display:flex;gap:25px;font-size:13px}
.nav-links a:hover{color:var(--green2)}
.nav-buttons{display:flex;gap:9px}
.nav-buttons a{
border:1px solid var(--border);padding:10px 13px;
border-radius:10px;font-size:12px
}

.hero{
background:linear-gradient(120deg,#073b32,#145c49);
color:white;padding:55px 0
}
.hero h1{font-size:32px}
.hero p{font-size:13px;color:#d4e5dc;margin-top:12px}

main{padding:35px 0 75px}

.toolbar{
background:white;padding:20px;border:1px solid var(--border);
border-radius:17px;display:grid;
grid-template-columns:2fr 1fr 1fr;gap:12px
}
.field{
height:47px;border:1px solid var(--border);
border-radius:11px;background:#fff;
padding:0 13px;width:100%;outline:none;font-size:12px
}
.field:focus{border-color:var(--green2)}

.result-heading{
display:flex;justify-content:space-between;
align-items:center;margin:35px 0 20px
}
.result-heading h2{font-size:20px;color:var(--green)}
.result-count{font-size:12px;color:var(--muted)}

.grid{
display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.card{
background:white;border:1px solid var(--border);
border-radius:17px;overflow:hidden;transition:.2s
}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 25px #00000009}
.card-image{
width:100%;aspect-ratio:1/1;object-fit:cover;
background:#edf3ee;display:block
}
.card-info{padding:15px}
.card-name{font-size:14px;font-weight:600;line-height:2}
.card-description{
font-size:11px;color:var(--muted);
margin-top:5px;line-height:2;
display:-webkit-box;-webkit-line-clamp:2;
-webkit-box-orient:vertical;overflow:hidden
}
.card-price{
font-size:16px;color:var(--green);
font-weight:800;margin-top:12px
}
.stock{
font-size:10px;color:#26835a;margin-top:7px
}
.view-btn{
display:block;text-align:center;background:var(--green);
color:white;padding:11px;border-radius:10px;
font-size:12px;margin-top:13px
}
.empty{
background:white;border:1px dashed #cbd9ce;
border-radius:18px;padding:65px 20px;
text-align:center;grid-column:1/-1
}
.empty-icon{font-size:45px;margin-bottom:15px}
.empty h3{color:var(--green);font-size:17px}
.empty p{color:var(--muted);font-size:12px;margin-top:10px;line-height:2}

.loading{grid-column:1/-1;text-align:center;padding:55px;color:var(--muted)}

.pagination{
display:flex;justify-content:center;gap:8px;margin-top:30px
}
.pagination button{
padding:10px 16px;border:1px solid var(--border);
background:white;border-radius:9px;cursor:pointer
}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

footer{
background:#082c25;color:white;text-align:center;
padding:30px 15px;font-size:12px
}

@media(max-width:850px){
.grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
.nav-links{display:none}
.toolbar{grid-template-columns:1fr}
.grid{grid-template-columns:repeat(2,1fr);gap:10px}
.hero h1{font-size:25px}
.card-info{padding:11px}
.card-name{font-size:12px}
.card-price{font-size:13px}
}
</style>
</head>

<body>

<header>
<div class="container nav">
<a href="index.html" class="logo">
ZENVIA
<small>YOUR EVERYDAY DESTINATION</small>
</a>

<nav class="nav-links">
<a href="index.html">صفحه اصلی</a>
<a href="shop.html">فروشگاه</a>
<a href="ai.html">دستیار خرید هوشمند</a>
<a href="orders.html">پیگیری سفارش</a>
</nav>

<div class="nav-buttons">
<a href="cart.html">🛒 سبد خرید</a>
</div>
</div>
</header>

<section class="hero">
<div class="container">
<h1>فروشگاه زنویا</h1>
<p>محصولات شرکت بیز، به قیمت کارخانه</p>
</div>
</section>

<main class="container">

<section class="toolbar">

<input
id="search"
class="field"
type="search"
placeholder="نام محصول موردنظر را جست‌وجو کن..."
autocomplete="off"
>

<select id="category" class="field">
<option value="">همه دسته‌بندی‌ها</option>
<option value="cosmetics">آرایشی و زیبایی</option>
<option value="health">سلامت و بهداشت</option>
<option value="food">خوراکی و نوشیدنی</option>
<option value="other">سایر محصولات</option>
</select>

<select id="sort" class="field">
<option value="newest">جدیدترین محصولات</option>
<option value="cheap">ارزان‌ترین</option>
<option value="expensive">گران‌ترین</option>
</select>

</section>

<div class="result-heading">
<h2>محصولات</h2>
<span class="result-count" id="count">در حال دریافت...</span>
</div>

<section class="grid" id="products">
<div class="loading">در حال دریافت محصولات...</div>
</section>

<div class="pagination">
<button id="prev" disabled>قبلی</button>
<button id="next" disabled>بعدی</button>
</div>

</main>

<footer>
© 2026 ZENVIA — تمامی حقوق محفوظ است.
</footer>

<script type="module">
import {createClient} from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* تنظیمات اتصال */
const SUPABASE_URL='';
const SUPABASE_ANON_KEY='';

const productsElement=document.getElementById('products');
const searchInput=document.getElementById('search');
const categoryInput=document.getElementById('category');
const sortInput=document.getElementById('sort');
const countElement=document.getElementById('count');

const PAGE_SIZE=16;
let page=0;
let supabase=null;
let timer=null;

function message(title,description,icon='🛍️'){
productsElement.innerHTML=`
<div class="empty">
<div class="empty-icon">${icon}</div>
<h3>${title}</h3>
<p>${description}</p>
</div>`;
countElement.textContent='۰ محصول';
document.getElementById('prev').disabled=true;
document.getElementById('next').disabled=true;
}

function safeText(value){
return String(value??'');
}

function makeCard(product){
const card=document.createElement('article');
card.className='card';

const link=document.createElement('a');
link.href='product.html?id='+encodeURIComponent(product.id);

const img=document.createElement('img');
img.className='card-image';
img.src=product.image_url||'';
img.alt=safeText(product.name);
img.loading='lazy';

const info=document.createElement('div');
info.className='card-info';

const name=document.createElement('h3');
name.className='card-name';
name.textContent=safeText(product.name);

const description=document.createElement('p');
description.className='card-description';
description.textContent=safeText(product.description);

const price=document.createElement('div');
price.className='card-price';
price.textContent=Number(product.price).toLocaleString('fa-IR')+' تومان';

const stock=document.createElement('div');
stock.className='stock';
stock.textContent='موجود در فروشگاه';

const btn=document.createElement('div');
btn.className='view-btn';
btn.textContent='مشاهده محصول';

info.append(name,description,price,stock,btn);
link.append(img,info);
card.append(link);

img.onerror=()=>img.remove();

return card;
}

async function loadProducts(){

if(!supabase){
message(
'اتصال فروشگاه تنظیم نشده است',
'ابتدا اطلاعات اتصال Supabase در تنظیمات این فایل وارد شود.',
'⚙️'
);
return;
}

productsElement.innerHTML='<div class="loading">در حال دریافت...</div>';

try{

let query=supabase
.from('products')
.select('id,name,description,price,image_url,stock,category,created_at',
{count:'exact'})
.eq('is_active',true)
.gt('stock',0);

const search=searchInput.value.trim();
const category=categoryInput.value;

if(search){
const escaped=search.replace(/[,%()]/g,'');
query=query.ilike('name','%'+escaped+'%');
}

if(category){
query=query.eq('category',category);
}

if(sortInput.value==='cheap'){
query=query.order('price',{ascending:true});
}else if(sortInput.value==='expensive'){
query=query.order('price',{ascending:false});
}else{
query=query.order('created_at',{ascending:false});
}

const start=page*PAGE_SIZE;
query=query.range(start,start+PAGE_SIZE-1);

const {data,error,count}=await query;

if(error) throw error;

productsElement.innerHTML='';

if(!data||data.length===0){
message(
'هنوز محصولی ثبت نشده است',
'محصولی مطابق جست‌وجو یا فیلتر انتخاب‌شده پیدا نشد.'
);
return;
}

data.forEach(product=>{
productsElement.appendChild(makeCard(product));
});

countElement.textContent=
Number(count||0).toLocaleString('fa-IR')+' محصول';

document.getElementById('prev').disabled=page===0;
document.getElementById('next').disabled=
start+data.length>=count;

}catch(error){
console.error(error);
message(
'خطا در دریافت اطلاعات',
'ارتباط با دیتابیس برقرار نشد. لطفاً بعداً تلاش کن.',
'⚠️'
);
}
}

searchInput.addEventListener('input',()=>{
clearTimeout(timer);
timer=setTimeout(()=>{
page=0;
loadProducts();
},350);
});

categoryInput.addEventListener('change',()=>{
page=0;
loadProducts();
});

sortInput.addEventListener('change',()=>{
page=0;
loadProducts();
});

document.getElementById('prev').addEventListener('click',()=>{
if(page>0){
page--;
loadProducts();
window.scrollTo({top:0,behavior:'smooth'});
}
});

document.getElementById('next').addEventListener('click',()=>{
page++;
loadProducts();
window.scrollTo({top:0,behavior:'smooth'});
});

if(SUPABASE_URL&&SUPABASE_ANON_KEY){
supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
}

const params=new URLSearchParams(location.search);
const initialCategory=params.get('category');

if(['cosmetics','health','food','other'].includes(initialCategory)){
categoryInput.value=initialCategory;
}

loadProducts();
</script>

</body>
</html>
